# Serves the built SPA (dist/) inside the production image. This container
# only ever serves static files — the browser calls the API directly at
# VITE_API_BASE_URL, so there's no /api proxy block here. Real request-rate
# limiting for the API itself lives server-side in
# apps/api/src/middleware/rateLimit.ts; the zone below is just a light
# defense-in-depth cap on this static-asset server, not a substitute for it.
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=web_limit burst=40 nodelay;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml application/manifest+json;

    # HSTS assumes TLS is terminated upstream (load balancer/ingress) — this
    # container itself only listens on plain HTTP, matching how it's deployed
    # behind a cloud LB rather than terminating TLS itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # sw.js and the manifest control PWA update behavior (vite-plugin-pwa,
    # registerType: 'autoUpdate') — caching them defeats that: a stale sw.js
    # in a CDN/browser cache means users never see a new deploy.
    location ~* \.(?:webmanifest|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build output (assets/*-[hash].js etc.) is safe to cache
    # forever — a new deploy ships new filenames, never overwrites these.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — client-side routes (TanStack Router) resolve on index.html.
    location / {
        try_files $uri /index.html;
    }
}
