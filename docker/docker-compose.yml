name: agridealer-erp

services:
  # Builds and serves the production SPA (apps/web/Dockerfile + nginx.conf).
  # Under the "full" profile so the default `docker compose up` still only
  # brings up backing stores — day-to-day dev runs the app via `npm run dev`
  # against these same containers, not this build. Bring it up explicitly
  # with `docker compose --profile full up web` to smoke-test the actual
  # deployable image.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_ROOT_DOMAIN: ${VITE_ROOT_DOMAIN:-localhost}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: agridealer-web
    profiles: ["full"]
    ports:
      - "8081:80"

  mongo:
    image: mongo:7
    container_name: agridealer-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init-replicaset:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --eval
      "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"

  redis:
    image: redis:7-alpine
    container_name: agridealer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: agridealer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  minio-data:
